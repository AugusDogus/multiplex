name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create test environment
        run: |
          {
            echo 'DATABASE_URL="file:./db.sqlite"'
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)"
            echo 'BETTER_AUTH_URL=http://localhost:3000'
          } > apps/web/.env

      - name: Run checks
        run: bun run check

      - name: Run tests
        run: bun run test

  gamecube:
    name: GameCube native
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read pinned tool versions
        id: pins
        working-directory: apps/gamecube
        run: |
          set -eu
          . ./PINS.env
          echo "zig-version=$ZIG_VERSION" >> "$GITHUB_OUTPUT"
          echo "ruff-version=$RUFF_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.pins.outputs.zig-version }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/gamecube/requirements*.txt

      - name: Install native verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format-18 shellcheck
          python3 -m pip install \
            --requirement apps/gamecube/requirements-dev.txt
          test "$(ruff --version)" = \
            "ruff ${{ steps.pins.outputs.ruff-version }}"

      - name: Restore pinned GameCube dependencies
        id: gamecube-cache
        uses: actions/cache@v4
        with:
          path: |
            apps/gamecube/.ci-cache/devkitppc-image.tar
            apps/gamecube/.native-sdk
            apps/gamecube/.libogc2
            apps/gamecube/.libogc2-stage
            apps/gamecube/.mplayer-ce-libogc2
            apps/gamecube/.mbedtls
            apps/gamecube/.mbedtls-stage
          key: gamecube-v1-${{ runner.os }}-${{ hashFiles('apps/gamecube/PINS.env', 'apps/gamecube/patches/**', 'apps/gamecube/requirements*.txt', 'apps/gamecube/app.zon', 'apps/gamecube/build.zig', 'apps/gamecube/build.zig.zon', 'apps/gamecube/host-reference-gx/mbedtls-gamecube-config.h', 'apps/gamecube/Makefile.assets', 'apps/gamecube/Makefile.reference.gamecube', 'apps/gamecube/scripts/bootstrap*.sh', 'apps/gamecube/scripts/build-native-reference-dol.sh', 'bun.lock') }}

      - name: Prepare pinned devkitPPC toolchain
        run: sh apps/gamecube/scripts/prepare-ci-toolchain.sh

      - name: Bootstrap pinned native dependencies
        run: bun run gamecube:bootstrap

      - name: Run native lint
        env:
          CLANG_FORMAT: clang-format-18
        run: bun run gamecube:lint

      - name: Run portable and PowerPC core tests
        run: bun run gamecube:test:portable

      - name: Run host tests under ASan and UBSan
        run: bun run gamecube:test:sanitize

      - name: Cross-build Dolphin reference DOL
        run: bun run gamecube:reference:dol
