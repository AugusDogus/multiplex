# PR preview deploys: GitHub Actions owns create / deploy / cleanup.
# Docker stays host-agnostic; Railway is only the deploy target via the CLI.
name: Railway preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: railway-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Same-repo PRs only — forks never get a preview from this workflow.
  #
  # Optional approval: create a GitHub Environment named `railway-preview`
  # with required reviewers, then uncomment `environment:` below.
  deploy:
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # environment: railway-preview
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check Railway configuration
        id: config
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
        run: |
          if [ -z "${RAILWAY_TOKEN:-}" ] || [ -z "${RAILWAY_PROJECT_ID:-}" ] || [ -z "${RAILWAY_ENVIRONMENT_ID:-}" ] || [ -z "${RAILWAY_SERVICE_ID:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Railway preview secrets/vars not configured — skipping (see docs/railway-previews.md)."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "pr_env=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install Railway CLI
        if: steps.config.outputs.configured == 'true'
        run: |
          curl -fsSL https://railway.com/install.sh | sh
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      - name: Ensure PR environment
        if: steps.config.outputs.configured == 'true'
        id: env
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          PR_ENV: ${{ steps.config.outputs.pr_env }}
        run: |
          railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID"

          if railway environment list --json | grep -Fq "\"name\":\"${PR_ENV}\""; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            railway environment new "${PR_ENV}" --copy "${RAILWAY_ENVIRONMENT_ID}"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

          railway link --project "$RAILWAY_PROJECT_ID" --environment "${PR_ENV}"

          # Public domain for this service in the PR environment (create if missing).
          domain_json="$(railway domain list --service "$RAILWAY_SERVICE_ID" --environment "${PR_ENV}" --json 2>/dev/null || echo '[]')"
          domain="$(printf '%s' "$domain_json" | sed -n 's/.*"domain"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n 1)"
          if [ -z "$domain" ]; then
            domain_json="$(railway domain --service "$RAILWAY_SERVICE_ID" --environment "${PR_ENV}" --json)"
            domain="$(printf '%s' "$domain_json" | sed -n 's/.*"domain"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n 1)"
          fi
          if [ -z "$domain" ]; then
            echo "Failed to resolve a Railway domain for ${PR_ENV}" >&2
            exit 1
          fi

          echo "domain=${domain}" >> "$GITHUB_OUTPUT"
          railway variable set \
            "BETTER_AUTH_URL=https://${domain}" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment "${PR_ENV}" \
            --skip-deploys

      - name: Deploy with Docker via railway up
        if: steps.config.outputs.configured == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          PR_ENV: ${{ steps.config.outputs.pr_env }}
        run: |
          railway link --project "$RAILWAY_PROJECT_ID" --environment "${PR_ENV}"
          railway up --ci --yes --service "$RAILWAY_SERVICE_ID" --environment "${PR_ENV}"

      - name: Comment preview URL
        if: steps.config.outputs.configured == 'true' && steps.env.outputs.domain != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_DOMAIN: ${{ steps.env.outputs.domain }}
          PR_ENV: ${{ steps.config.outputs.pr_env }}
        with:
          script: |
            const url = `https://${process.env.PREVIEW_DOMAIN}`;
            const body = [
              '### Railway preview',
              '',
              `- URL: ${url}`,
              `- Environment: \`${process.env.PR_ENV}\``,
              '',
              '_Deployed by GitHub Actions from this PR head (Docker build via `railway up`)._',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '### Railway preview';
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  destroy:
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # environment: railway-preview
    permissions:
      contents: read
    steps:
      - name: Check Railway configuration
        id: config
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
        run: |
          if [ -z "${RAILWAY_TOKEN:-}" ] || [ -z "${RAILWAY_PROJECT_ID:-}" ] || [ -z "${RAILWAY_ENVIRONMENT_ID:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Railway preview secrets/vars not configured — skipping cleanup."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Install Railway CLI
        if: steps.config.outputs.configured == 'true'
        run: |
          curl -fsSL https://railway.com/install.sh | sh
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      - name: Delete PR environment
        if: steps.config.outputs.configured == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          PR_ENV: pr-${{ github.event.pull_request.number }}
        run: |
          railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID"
          railway environment delete "${PR_ENV}" --yes || true
