# Used when GitHub Actions runs `railway up` (remote Docker build).
# The Docker image itself has no Railway coupling — see Dockerfile / entrypoint.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/favicon.svg"
healthcheckTimeout = 300
